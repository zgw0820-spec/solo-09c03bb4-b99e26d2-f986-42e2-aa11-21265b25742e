services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: faultdb
      POSTGRES_USER: fault_admin
      POSTGRES_PASSWORD: fault_admin
    ports:
      - "5432:5432"
    volumes:
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault_admin -d faultdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://fault_ro:fault_ro@db:5432/faultdb
      POOL_SIZE: "2"
      # 分页会话闲置释放时限（默认即 30s，显式写出便于调整）。
      PAGED_IDLE_TIMEOUT_MS: "30000"
      # 仅供容器内自测（python -m tests.selftest）执行混沌/快照注入；
      # 应用本身只使用上面的只读 DSN。
      ADMIN_DSN: postgresql://fault_admin:fault_admin@db:5432/faultdb
    ports:
      - "8000:8000"

volumes:
  pgdata:
